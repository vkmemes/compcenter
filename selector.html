<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border)] pb-3 mb-3">
      <div>
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-[var(--foreground)]">Селектор аудиторий для развертывания Renga</h2>
          <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-blue-500/10 text-blue-500 border border-blue-500/20">домен ygk.ru</span>
        </div>
        <p class="text-xs text-[var(--muted-foreground)]">Выберите классы для автоматического обновления Renga Professional</p>
      </div>
      <div id="statsBadge" class="flex items-center gap-2 px-3 py-1 rounded-lg bg-green-500/10 border border-green-500/20 text-green-600 font-semibold text-xs">
        <span>Выбрано: 7 классов | 108 ПК</span>
      </div>
    </div>

    <!-- Quick Presets & Search -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <div class="flex flex-wrap gap-1.5 text-xs">
        <button onclick="applyPreset('bim')" class="px-2.5 py-1 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 transition">⭐ BIM-классы (~108 ПК)</button>
        <button onclick="applyPreset('corpusB')" class="px-2.5 py-1 rounded-md bg-[var(--background)] border border-[var(--border)] hover:bg-[var(--border)] transition">Корпус Б (160 ПК)</button>
        <button onclick="applyPreset('all')" class="px-2.5 py-1 rounded-md bg-[var(--background)] border border-[var(--border)] hover:bg-[var(--border)] transition">Все (293 ПК)</button>
        <button onclick="applyPreset('none')" class="px-2 py-1 rounded-md text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">Сбросить</button>
      </div>
      <div>
        <input id="searchInput" type="text" placeholder="Поиск класса..." oninput="filterRooms()" class="px-2.5 py-1 text-xs rounded-md bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] focus:outline-none focus:ring-1 focus:ring-blue-500 w-36">
      </div>
    </div>

    <!-- Classrooms Grid -->
    <div id="roomsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 max-h-56 overflow-y-auto pr-1 mb-3">
      <!-- Cards rendered by JS -->
    </div>

    <!-- Output & Actions -->
    <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg p-3 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-semibold text-[var(--muted-foreground)]">Команда для запуска в PowerShell:</span>
        <div class="flex gap-2">
          <button onclick="downloadComputersTxt()" class="px-2.5 py-1 text-xs rounded font-medium bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--border)] transition flex items-center gap-1">
            📥 Сохранить computers.txt
          </button>
          <button id="copyBtn" onclick="copyCommand()" class="px-3 py-1 text-xs rounded font-medium bg-blue-600 text-white hover:bg-blue-700 transition">
            📋 Скопировать команду
          </button>
        </div>
      </div>
      <div class="relative">
        <pre id="cmdPreview" class="p-2 rounded bg-[var(--card)] border border-[var(--border)] text-[11px] font-mono overflow-x-auto text-[var(--foreground)] select-all whitespace-nowrap"></pre>
      </div>
    </div>
  </div>

  <script>
    const classrooms = [
      { room: "B309", building: "Корпус Б", label: "Ауд. Б309 (BIM-лаб)", count: 15, bim: true },
      { room: "B308", building: "Корпус Б", label: "Ауд. Б308", count: 15, bim: true },
      { room: "B302", building: "Корпус Б", label: "Ауд. Б302", count: 17, bim: true },
      { room: "B304", building: "Корпус Б", label: "Ауд. Б304", count: 15, bim: true },
      { room: "B305", building: "Корпус Б", label: "Ауд. Б305", count: 15, bim: true },
      { room: "B406", building: "Корпус Б", label: "Ауд. Б406", count: 15, bim: true },
      { room: "B407", building: "Корпус Б", label: "Ауд. Б407", count: 16, bim: true },
      { room: "B403", building: "Корпус Б", label: "Ауд. Б403", count: 13, bim: false },
      { room: "B204", building: "Корпус Б", label: "Ауд. Б204", count: 12, bim: false },
      { room: "B301", building: "Корпус Б", label: "Ауд. Б301", count: 15, bim: false },
      { room: "B310", building: "Корпус Б", label: "Ауд. Б310", count: 15, bim: false },
      { room: "A407", building: "Корпус А", label: "Ауд. А407", count: 14, bim: false },
      { room: "A409", building: "Корпус А", label: "Ауд. А409", count: 12, bim: false },
      { room: "A401", building: "Корпус А", label: "Ауд. А401", count: 9, bim: false },
      { room: "F205", building: "Корпус Ф", label: "Ауд. Ф205", count: 18, bim: false },
      { room: "F305", building: "Корпус Ф", label: "Ауд. Ф305", count: 13, bim: false },
      { room: "T310", building: "Корпус Т", label: "Ауд. Т310", count: 16, bim: false },
      { room: "T302", building: "Корпус Т", label: "Ауд. Т302", count: 12, bim: false },
      { room: "VR",   building: "Кванториум/IT", label: "VR Лаб", count: 18, bim: false },
      { room: "IT",   building: "Кванториум/IT", label: "IT Полигон", count: 17, bim: false }
    ];

    let selectedRooms = new Set(["B309", "B308", "B302", "B304", "B305", "B406", "B407"]);

    function renderRooms() {
      const grid = document.getElementById("roomsGrid");
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      grid.innerHTML = "";

      classrooms.forEach(c => {
        if (search && !c.room.toLowerCase().includes(search) && !c.building.toLowerCase().includes(search) && !c.label.toLowerCase().includes(search)) {
          return;
        }
        const isChecked = selectedRooms.has(c.room);
        const card = document.createElement("div");
        card.className = `p-2 rounded-lg border cursor-pointer select-none transition flex flex-col justify-between ${
          isChecked 
            ? "bg-blue-500/10 border-blue-500 text-[var(--foreground)]" 
            : "bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)] hover:border-blue-300"
        }`;
        card.onclick = () => toggleRoom(c.room);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-1">
            <span class="font-bold text-xs ${isChecked ? "text-blue-600 dark:text-blue-400" : "text-[var(--foreground)]"}">${c.room}</span>
            <input type="checkbox" ${isChecked ? "checked" : ""} class="rounded border-gray-400 pointer-events-none mt-0.5">
          </div>
          <div class="mt-1 flex items-center justify-between text-[10px]">
            <span class="truncate opacity-80">${c.building}</span>
            <span class="font-semibold px-1 py-0.2 rounded bg-[var(--card)] border border-[var(--border)]">${c.count} ПК</span>
          </div>
        `;
        grid.appendChild(card);
      });

      updateUI();
    }

    function toggleRoom(room) {
      if (selectedRooms.has(room)) {
        selectedRooms.delete(room);
      } else {
        selectedRooms.add(room);
      }
      renderRooms();
    }

    function applyPreset(preset) {
      selectedRooms.clear();
      if (preset === 'bim') {
        classrooms.filter(c => c.bim).forEach(c => selectedRooms.add(c.room));
      } else if (preset === 'corpusB') {
        classrooms.filter(c => c.building === "Корпус Б").forEach(c => selectedRooms.add(c.room));
      } else if (preset === 'all') {
        classrooms.forEach(c => selectedRooms.add(c.room));
      }
      renderRooms();
    }

    function filterRooms() {
      renderRooms();
    }

    function updateUI() {
      let totalPcs = 0;
      classrooms.forEach(c => {
        if (selectedRooms.has(c.room)) totalPcs += c.count;
      });

      const badge = document.getElementById("statsBadge");
      badge.innerHTML = `<span>Выбрано: ${selectedRooms.size} классов | ${totalPcs} ПК</span>`;
      badge.className = `flex items-center gap-2 px-3 py-1 rounded-lg border font-semibold text-xs ${
        totalPcs > 0 ? "bg-green-500/10 border-green-500/20 text-green-600" : "bg-gray-500/10 border-gray-500/20 text-gray-500"
      }`;

      const cmdElem = document.getElementById("cmdPreview");
      if (selectedRooms.size === 0) {
        cmdElem.textContent = "# Выберите хотя бы одну аудиторию выше";
      } else {
        const sorted = Array.from(selectedRooms).sort();
        const roomsArg = sorted.map(r => `"${r}"`).join(", ");
        cmdElem.textContent = `.\\Deploy-RengaRemote.ps1 -Classrooms ${roomsArg} -ThrottleLimit 10`;
      }
    }

    function copyCommand() {
      const text = document.getElementById("cmdPreview").textContent;
      if (text.startsWith("#")) return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyBtn");
        const orig = btn.innerHTML;
        btn.innerHTML = "✅ Скопировано!";
        setTimeout(() => { btn.innerHTML = orig; }, 1500);
      });
    }

    function downloadComputersTxt() {
      if (selectedRooms.size === 0) {
        alert("Выберите хотя бы одну аудиторию!");
        return;
      }
      fetch("file:///c:/code/compcenter/classrooms.json")
        .then(r => r.json())
        .catch(() => null)
        .then(data => {
          let list = [];
          if (data) {
            data.filter(c => selectedRooms.has(c.Room)).forEach(c => {
              if (c.Computers) list.push(...c.Computers);
            });
          }
          if (list.length === 0) {
            selectedRooms.forEach(r => list.push(`${r.toLowerCase()}-01.ygk.ru`));
          }
          const blob = new Blob([list.join("\r\n")], { type: "text/plain;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "computers.txt";
          a.click();
        });
    }

    renderRooms();
  </script>
</body>
</html>
